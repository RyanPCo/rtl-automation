[project]
name = "waveform-mcp"
version = "0.1.0"
description = "MCP server for RTL waveform debugging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "vcdvcd>=2.5.0",
]

[project.scripts]
waveform-mcp = "waveform_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waveform_mcp"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
